ase encerrada</tspan></text></g><g id="ios-contain" class="bpmn-node" data-node="contain"><rect class="task" x="850" y="710" width="150" height="64" rx="12"/><text x="925.0" y="737.0" text-anchor="middle" class="task-label"><tspan x="925.0" dy="0">Conter distribuição</tspan><tspan x="925.0" dy="22">e abrir incidente</tspan></text></g><g id="ios-patch" class="bpmn-node" data-node="patch"><rect class="task" x="620" y="710" width="150" height="64" rx="12"/><text x="695.0" y="737.0" text-anchor="middle" class="task-label"><tspan x="695.0" dy="0">Registrar correção</tspan><tspan x="695.0" dy="22">em nova demanda</tspan></text></g><g id="ios-pending" class="bpmn-node" data-node="pending"><circle class="event end" cx="503.0" cy="742.0" r="16.0"/><text x="503.0" y="784" text-anchor="middle" class="event-label"><tspan x="503.0" dy="0">Nova versão</tspan><tspan x="503.0" dy="22">necessária</tspan></text></g></svg>